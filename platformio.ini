; ------------------------------------------------------------------
; C64uRemote fuer M5Stack CoreS3 / CoreS3 SE / CoreS3 Lite
;   + Unit RFID2 (WS1850S) an Port A
;   + microSD im eingebauten Slot
;
;   Build:    pio run
;   Flashen:  pio run -t upload
;   Monitor:  pio device monitor
;
; Hinweis zum Flashen: der CoreS3 meldet sich als native USB-CDC.
; Kommt kein Port zustande, die RESET-Taste 3 s halten (gruene LED an,
; Download-Modus) und den Upload dann erneut starten.
; ------------------------------------------------------------------

[platformio]
default_envs = m5stack-cores3

[env:m5stack-cores3]
platform  = espressif32@^6.9.0
board     = m5stack-cores3
framework = arduino

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder
upload_speed    = 1500000

; Grosses App-Image, kein OTA -> genug Platz fuer WiFi + SD + RFID
board_build.partitions = huge_app.csv

; Der CoreS3 hat 8 MB PSRAM. Der Offscreen-Puffer (320x240x2 = 150 kB)
; liegt dort; der Code faellt automatisch auf direktes Zeichnen zurueck,
; falls die Zuteilung einmal nicht klappt.
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -std=gnu++17
build_unflags =
    -std=gnu++11

lib_ldf_mode = deep+
lib_deps =
    m5stack/M5Unified @ ^0.2.8
    m5stack/M5GFX @ ^0.2.11
    bblanchon/ArduinoJson @ ^6.21.5
    https://github.com/kkloesener/MFRC522_I2C.git
    ; Statuslampe (SK6812 / WS2812 an Port B). Wird nur angesteuert, wenn
    ; "Status-LED" im Setup eingeschaltet ist - haengt nichts dran, ist das
    ; Ansteuern folgenlos.
    adafruit/Adafruit NeoPixel @ ^1.12.0
